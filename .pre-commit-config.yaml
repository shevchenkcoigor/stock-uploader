# Runs on every `git commit`. Install once with:  pipx install pre-commit && pre-commit install
# The hooks use the tools the app itself needs (Node 22+ and a Rust toolchain), nothing else.
repos:
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: npm --prefix app run lint
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
      - id: vitest
        name: vitest
        entry: npm --prefix app test
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --manifest-path app/src-tauri/Cargo.toml
        language: system
        types_or: [rust, toml]
        pass_filenames: false
