# Runs on every `git commit`. Install once with:  .venv/bin/pre-commit install
# Hooks use the project's own virtualenv so versions match what `pip install -e ".[dev]"` gave you.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: basedpyright
        name: basedpyright
        entry: .venv/bin/basedpyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest -q -n auto
        language: system
        types: [python]
        pass_filenames: false
