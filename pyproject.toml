[project]
name = "adobe-stock-uploader"
version = "0.1.0"
description = "Validate, caption, upload and track Adobe Stock batches"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0",
    "paramiko>=5.1",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "basedpyright>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
pythonVersion = "3.12"
include = ["adobe_stock", "tests"]
venvPath = "."
venv = ".venv"
# basedpyright defaults to "recommended", which is very strict; "standard" is the usual
# starting point. Switch to "recommended" once the code is clean under it.
typeCheckingMode = "standard"
