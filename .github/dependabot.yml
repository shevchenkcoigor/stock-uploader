# Update pull requests, checked by the usual CI. They do not merge by themselves.
# Minor and patch updates come as one pull request per ecosystem; a major update gets its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    # the types follow the Node version CI runs on; raise both together
    ignore:
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  # the window tests: @wdio/tauri-service decides which major of WebdriverIO fits
  - package-ecosystem: npm
    directory: /app/e2e
    schedule: { interval: weekly }
    ignore:
      - { dependency-name: "@wdio/*", update-types: ["version-update:semver-major"] }
      - { dependency-name: webdriverio, update-types: ["version-update:semver-major"] }
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule: { interval: weekly }
    # keyring 4 drops the features used here; move to it by hand. The WebDriver plugin of the window tests must
    # keep the major of @wdio/tauri-service.
    ignore:
      - { dependency-name: keyring, update-types: ["version-update:semver-major"] }
      - { dependency-name: tauri-plugin-wdio-webdriver, update-types: ["version-update:semver-major"] }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
