name: Checks

# Shared by build.yml (pull requests and main) and release.yml (before a release). Both start their builds only
# after every job here passed.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Fast: no compilation and no system libraries, so style errors show up first.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: rustup toolchain install # as in rust-toolchain.toml
      - run: npm ci
      - run: npm run lint
      - name: cargo fmt
        working-directory: app/src-tauri
        run: cargo fmt --check
      # The server of the window tests lets a local process drive the app. It is behind the `e2e` feature, so
      # the dependency tree of a normal (release) build must not contain it.
      - name: No WebDriver server in a normal build
        working-directory: app/src-tauri
        run: |
          tree=$(cargo tree --locked --target all --edges normal --prefix none)
          if grep -i wdio <<<"$tree"; then
            echo "a WebDriver plugin is part of the default build" >&2
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # clippy and the tests stay in one job: two would compile the dependencies twice.
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # as in rust-toolchain.toml
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Tauri system libraries
        timeout-minutes: 10 # apt-get has hung for 20+ minutes before
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  # Catches platform-specific breakage. Not on Windows yet: the stand-in `claude` of the caption tests is a
  # Unix shell script.
  macos:
    name: Rust tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # as in rust-toolchain.toml
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test

  # Known vulnerabilities in npm packages and Rust crates. A newly published advisory can turn this red without
  # any change in the code.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: npm audit
        working-directory: app
        run: npm audit --audit-level=high
      - name: cargo audit
        working-directory: app/src-tauri
        run: cargo audit
