name: Build desktop app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older, still running check of the same branch pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # basedpyright reads its interpreter from .venv (see pyproject.toml), so install there.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: ruff check
        run: .venv/bin/ruff check
      - name: ruff format
        run: .venv/bin/ruff format --check
      - name: basedpyright
        run: .venv/bin/basedpyright

  test:
    name: Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  # Builds run only when lint and the tests of every OS passed.
  build:
    name: Build (${{ matrix.os }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Detects the OS, installs the project, runs PyInstaller and starts the result once.
      - name: Build
        run: python packaging/build.py --zip
      # upload-artifact would lose the executable bit and symlinks inside a .app, so zip it with ditto.
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Adobe Stock Uploader.app" "dist/Adobe-Stock-Uploader-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: adobe-stock-uploader-${{ runner.os }}
          path: dist/Adobe-Stock-Uploader-*.zip
          if-no-files-found: error
          retention-days: 30
