name: Build desktop app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older, still running check of the same branch pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # basedpyright reads its interpreter from .venv (see pyproject.toml), so install there.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: ruff check
        run: .venv/bin/ruff check
      - name: ruff format
        run: .venv/bin/ruff format --check
      - name: basedpyright
        run: .venv/bin/basedpyright

  test:
    name: Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  app:
    name: App checks (frontend and Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test

  # Builds run only when the checks passed.
  build:
    name: Build (${{ matrix.os }})
    needs: [lint, test, app]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - name: Build
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: adobe-stock-uploader-${{ runner.os }}
          # a .dmg / .msi / .exe / .AppImage / .deb from each OS; the unsigned .app itself is inside the .dmg
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  # The only way into main: a pull request whose lint, tests, app checks and builds all passed.
  # Direct pushes to main are not blocked by GitHub on this plan, so the rule lives in CLAUDE.md,
  # .claude/settings.json and the pre-push hook.
  automerge:
    name: Merge into main
    needs: [lint, test, app, build]
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'main'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # --match-head-commit: merge only the commit that was checked, never a newer push.
      - name: Merge the pull request
        run: gh pr merge "$PR_URL" --merge --delete-branch --match-head-commit "$HEAD_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
