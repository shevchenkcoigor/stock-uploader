name: Build desktop app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Detects the OS, installs the project, runs PyInstaller and starts the result once.
      - name: Build
        run: python packaging/build.py --zip
      # upload-artifact would lose the executable bit and symlinks inside a .app, so zip it with ditto.
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Adobe Stock Uploader.app" "dist/Adobe-Stock-Uploader-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: adobe-stock-uploader-${{ runner.os }}
          path: dist/Adobe-Stock-Uploader-*.zip
          if-no-files-found: error
          retention-days: 30
