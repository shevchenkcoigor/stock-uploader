name: Build desktop app

# main is protected on GitHub: every job of checks.yml and every build is a required status check, and pull
# requests merge through auto-merge. After renaming or adding a job, update the required list in the repository
# settings, or pull requests wait forever.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older, still running check of the same branch pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Checks
    uses: ./.github/workflows/checks.yml

  # Builds run only when the checks passed.
  build:
    name: Build (${{ matrix.os }})
    needs: app
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: rustup toolchain install # as in rust-toolchain.toml
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10 # apt-get has hung for 20+ minutes before
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - name: Build
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: adobe-stock-uploader-${{ runner.os }}
          # a .dmg / .msi / .exe / .AppImage / .deb from each OS; the unsigned .app itself is inside the .dmg
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30
